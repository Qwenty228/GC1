[project]
name = "datasources"
version = "0.1.0"
description = "Node 1 — Data Sources: Alpaca financial news + SEC EDGAR 8-K filings, with a data-dictionary explorer UI."
requires-python = "==3.13.7"
dependencies = [
    "anthropic>=1.8.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.128.8",
    "filelock>=4.0.1",
    "langgraph>=1.2.12",
    "lxml>=6.1.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "uvicorn[standard]>=0.39.0",
    "websockets>=15.0",
]

[project.optional-dependencies]
# Local CPU embedding backend for semantic event grouping. Optional because torch
# is large; install with `uv sync --locked --extra local-embeddings`. The model
# itself is never downloaded implicitly: run `datasources-similarity download-model`.
local-embeddings = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
]

[project.scripts]
datasources = "datasources.cli:main"
datasources-server = "datasources.server:main"
datasources-dev = "datasources.launcher:main"
datasources-news-stream = "alpaca_news.main:main"
datasources-ingest = "datasources.ingest.cli:main"
datasources-db = "datasources.db.cli:main"
datasources-similarity = "datasources.similarity.cli:main"
datasources-summary = "datasources.summary.cli:main"
datasources-eval = "datasources.evaluation.cli:main"

# CPU-only PyTorch on every platform (uv's documented configuration): the default
# PyPI wheels pull CUDA libraries on Linux, which a CPU embedding model never uses.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
